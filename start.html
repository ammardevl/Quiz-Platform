<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start the Quiz</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="ammar-quiz">
      <div class="ammar-quiz-app-container">
        <div class="ammar-quiz-app-wrapper">
          <div class="start-wrap">
            <h2 class="ammar-quiz-app-h2">
              Get Ready to Test Your
              <span class="colored-area">Crypto Knowledge</span> in just 3
              minutes
            </h2>
            <ul class="ammar-quiz-app-start-terms">
              <li>
                <i class="ri-check-line"></i>
                <span> You will get 20 Questions with Growing Difficulty </span>
              </li>
              <li>
                <i class="ri-check-line"></i>
                <span> Select the right answer out of the 4 options </span>
              </li>
              <li>
                <i class="ri-check-line"></i>
                <span> You will get instant feedback on your performance </span>
              </li>
            </ul>
            <a href="/quiz.html">
              <button class="ammar-quiz-app-btn btn btn-start">
                Start Certified Test
              </button>
            </a>
          </div>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
