<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login to check Results</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="ammar-quiz">
      <div class="ammar-quiz-app-container">
        <div class="ammar-quiz-app-wrapper form-wrap">
          <h2 class="ammar-quiz-app-h2">Login to Check Your Results</h2>
          <form action="" class="ammar-quiz-app-form">
            <div class="form-lines">
              <div>
                <label for="name">First Name</label>
                <input
                  type="text"
                  placeholder="Enter first name"
                  name="name"
                  id="firstName"
                  required
                />
              </div>
              <div>
                <label for="name">Last Name</label>
                <input
                  type="text"
                  placeholder="Enter last name"
                  name="name"
                  id="lastName"
                  required
                />
              </div>
            </div>
            <div class="form-lines">
              <label for="email"
                >Email
                <address></address
              ></label>
              <input
                type="email"
                placeholder="Enter your email"
                name="email"
                id="email"
                required
              />
            </div>
            <div class="form-lines">
              <label for="password">Password</label>
              <input
                type="password"
                placeholder="Enter your password"
                name="password"
                id="password"
                required
              />
            </div>
            <button type="submit" class="ammar-quiz-app-btn submit-btn">
              Start Quiz
            </button>
          </form>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
